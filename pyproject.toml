[project]
name = "mobilesam"
version = "0.1.0"
description = "A project for finetuning MobileSAM model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "onnx>=1.21.0",
    "onnxruntime>=1.26.0",
    "opencv-python-headless>=4.13.0.92",
    "packaging>=26.2",
    "pypdf>=6.11.0",
    "tensorboard>=2.20.0",
    "timm>=1.0.27",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "wandb>=0.27.0",
    "wrapt>=2.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["**/submission_*.py", "*.ipynb"]

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"] 
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
